<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jwell's workshop</title>
    <link rel="stylesheet" href="./style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <nav>
        <div class="navLeft">
            <div class="logoImg"></div>
            <div class="name">Jwell Das Choudhary</div>
        </div>
        <div class="navRight">
            <ul>
                <li class="boldTxt"><a href="#aboutSection">About</li></a>
                <li class="boldTxt"><a href="#projectSection">Projects</li></a>
                <li class="boldTxt"><a href="#contactSection">Contact</li></a>
            </ul>
        </div>
    </nav>

    <section id="aboutSection">
        <div class="about">
            <div class="abtLeft">
                <div class="abtB1"></div>
                <div class="abtB2"></div>
            </div>
            <div class="abtRight">
                <div class="abtHead">
                    <div class="abtTxtHr"><hr>
                        <span class="abtTxt">&nbsp;About me!</span>
                    </div>
                    <span class="abt-mainTxt">Hi! I am Jwell!. A Photographer</span>
                </div>
            </div>
        </div>
        <div class="details">
            <div class="detLeft">
                <div class="detHead">
                    <div class="detTxtHr"><hr>
                        <span class="detTxt">&nbsp;My Work</span>
                    </div>
                    <span class="det-mainTxt">Whats My Work?</span>
                </div>

                <div class="det-icons">
                    <div class="detTopI">
                        <div class="smBox">
                            <i class="fa-solid fa-cake-candles"></i><br><span class="smTxt">Bday</span>
                        </div>
                        <div class="smBox">
                            <i class="fa-solid fa-champagne-glasses"></i><br><span class="smTxt">Party</span>
                        </div>
                    </div>
                    <div class="detBotI">
                        <div class="smBox">
                            <i class="fa-solid fa-video"></i><br><span class="smTxt">Video</span>
                        </div>
                        <div class="smBox">
                            <i class="fa-solid fa-camera"></i><br><span class="smTxt">Picss</span>
                        </div>
                    </div>
                </div>
            </div>
            <div class="detRight">
                <div class="det-b1"></div>
                <div class="det-b2"></div>
            </div>
        </div>
    </section>

    <section id="projectSection">
        <div class="projects">
            <div class="proTxtHr"><hr>
                <span class="proTxt boldTxt">&nbsp;Featured</span>
            </div>
            <!-- <p class="boldTxt">Featured</p> -->
            <div class="collection">
                <div class="colb1 feature"></div>
                <div class="colb2 feature"></div>
                <div class="colb3 feature"></div>
            </div>
            <div class="collection">
                <div class="colb1 feature"></div>
                <div class="colb2 feature"></div>
                <div class="colb3 feature"></div>
            </div>
        </div>
    </section>
    <section id="contactSection">
        <div class="contact">
            <div class="divideText">
                <hr>
                <span class="cnTxt boldTxt">&nbsp;&nbsp; Contact Us &nbsp;&nbsp;</span>
                <hr>
            </div>
            <div class="contactInfo">
                <div class="contactIcons">
                    <i class="fa-brands fa-instagram"></i>
                    <i class="fa-brands fa-facebook"></i>
                    <i class="fa-brands fa-twitter"></i>
                </div>
            </div>
        </div>
    </section>

</body>
</html>
